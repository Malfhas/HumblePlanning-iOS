name: iOS

# Runs on every pull request and on every push to main. The job names are the
# required status checks of the main branch: rename them in the ruleset too.
# The interface tests need the test server (tools/ui-tests.sh) and run locally.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Newest Xcode of the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          xcodebuild -version
      - name: Texts are generated from tools/textes.mjs
        run: |
          node tools/textes.mjs
          git diff --exit-code HumblePlanning/Resources
      - name: Unit tests of HumbleCore
        working-directory: Packages/HumbleCore
        run: swift test
      - name: The app builds
        run: |
          xcodebuild -project HumblePlanning.xcodeproj -scheme HumblePlanning \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qiF "$author"; then
              echo "::error::Commit ${sha:0:7} by ${author} is not signed off by its author. Sign it off with 'git commit -s' (see CONTRIBUTING.md)."
              status=1
            fi
          done
          exit "$status"
